<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseWatch WebSocket Test</title>
</head>

<body>

    <h1>PulseWatch WebSocket Test</h1>

    <p id="connectionStatus">Connecting...</p>

    <h2>Telemetry Updates</h2>

    <pre id="telemetryOutput"></pre>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>

        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            document.getElementById("connectionStatus").textContent =
                "Connected to PulseWatch WebSocket";

            stompClient.subscribe('/topic/telemetry', function (message) {

                const telemetry = JSON.parse(message.body);

                document.getElementById("telemetryOutput").textContent =
                    JSON.stringify(telemetry, null, 2);
            });

        }, function (error) {

            document.getElementById("connectionStatus").textContent =
                "WebSocket connection failed";

            console.error(error);
        });

    </script>

</body>
</html>
